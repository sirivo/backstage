apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: learning-platform
  description: Everything I'm building while learning Backstage
spec:
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: my-first-service
  description: Learning Backstage
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: learning-platform
  dependsOn:
    - resource:my-database
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: my-database
  description: Postgres instance for my-first-service
spec:
  type: database
  owner: guests
  system: learning-platform
